\* TLC configuration for the RPS protection-state model.
\* Three representative conditions keep the state space small; the logic is
\* independent of the condition count.
SPECIFICATION Spec

CONSTANT Conditions = {az5, overpower, flow}

INVARIANT TypeOK
INVARIANT NormalImpliesNoLatch
INVARIANT LatchImpliesScram
INVARIANT ActiveImpliesScram
INVARIANT AlarmImpliesNoLatch

PROPERTY LatchMonotoneWhileTripped
PROPERTY NoDirectResetFromTripped
PROPERTY SafeShutdownOnlyAfterTrip
PROPERTY NoResetWhileActive
PROPERTY TrippedLeadsToSafeShutdown
